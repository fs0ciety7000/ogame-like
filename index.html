<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 6.14.152 (R4) : joueur connecté sur une page du jeu : contenu du jeu et fiche du joueur demandés tout de suite,
      // pendant le téléchargement du JavaScript (repris une fois par src/lib/earlyData.ts ; erreur = chemin habituel du SDK).
      // Placé avant la feuille de style des polices, qui retiendrait ce script jusqu'à son arrivée.
      (function () {
        try {
          if (!/^\/game(\/|$)/.test(location.pathname) || !window.fetch) return;
          var auth = JSON.parse(localStorage.getItem("pocketbase_auth") || "null");
          if (!auth || !auth.token || !auth.record || !auth.record.id) return;
          var base = "%VITE_POCKETBASE_URL%";
          if (!base || base.charAt(0) === "%") base = "http://127.0.0.1:8090";
          base = base.replace(/\/+$/, "");
          var get = function (path) {
            return fetch(base + path, { headers: { Authorization: auth.token } }).then(function (r) {
              if (!r.ok) throw new Error(String(r.status));
              return r.json();
            });
          };
          var id = encodeURIComponent(auth.record.id);
          var early = { at: Date.now(), uid: auth.record.id };
          // Même lecture que contentService (archive des Chroniques exclue) ; 1 000 sections ou plus : chemin habituel.
          early.content = get("/api/collections/game_config/records?page=1&perPage=1000&skipTotal=1&filter=" + encodeURIComponent('key != "chronicles_archive"')).then(function (r) {
            if (!r || !r.items || r.items.length >= 1000) throw new Error("liste");
            return r.items;
          });
          early.players = get("/api/collections/players/records/" + id);
          early.queues = get("/api/collections/queues/records/" + id);
          early.content.catch(function () {});
          early.players.catch(function () {});
          early.queues.catch(function () {});
          window.__cosmicEarly = early;
        } catch (e) {}
      })();
    </script>

    <script>
      // Après une mise à jour, un navigateur qui a gardé l'ancienne page en cache
      // réclame des fichiers qui n'existent plus : la page resterait vide. On
      // recharge alors une fois pour récupérer la nouvelle version.
      window.__reloadForUpdate = function () {
        try {
          var last = Number(sessionStorage.getItem("cosmic-empires:update-reload") || 0);
          if (Date.now() - last < 30000) return false;
          sessionStorage.setItem("cosmic-empires:update-reload", String(Date.now()));
        } catch (e) {}
        var url = new URL(window.location.href);
        url.searchParams.set("v", Date.now().toString(36));
        window.location.replace(url.toString());
        return true;
      };
      window.addEventListener(
        "error",
        function (e) {
          var el = e.target;
          var src = el && (el.src || el.href);
          if (src && /\/assets\/[^/]+\.(js|css)(\?|$)/.test(src)) window.__reloadForUpdate();
        },
        true,
      );
    </script>
    <script>
      // Thème d'interface choisi (Réglages), appliqué avant le premier rendu.
      try {
        var t = localStorage.getItem("cosmic-empires:theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
