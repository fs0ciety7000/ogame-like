<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil du Jeu</title>

    <!-- Police Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">

</head>
<body>

    <!-- Écran d'accueil -->
    <div id="home-screen">
 
        <div class="title-zone">
            <h1>Cosmic Empires</h1>
        </div>
 
        <div class="button-zone">
 
            <!-- 🔹 LOGIN BOX -->
            <div id="login-box">
 
                <input type="text" id="username" placeholder="Nom du joueur">
                <input type="password" id="password" placeholder="Mot de passe">

                <p id="auth-error" style="color:#ff6b6b; font-size:0.9em; min-height:1.2em;"></p>
                 
                <button id="login-btn">Connexion</button>
 
                <div class="new-player-zone">
                    <button id="register-btn">Nouveau joueur</button>
                </div>
 
            </div>
            <!-- 🔹 FIN LOGIN BOX -->
 
        </div>
 
    </div>

    <!-- Étoiles scintillantes -->
    <div class="shooting-stars"></div>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/auth.js"></script>

    <!-- Script bouton -->
    <script>
        const startBtn = document.getElementById("start-btn");

        startBtn.addEventListener("click", () => {

            // Animation fade-out
            document.body.classList.add("fade-out");

            // Redirection
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 500);
        });
    </script>

    <!-- Script étoiles -->
    <script>
        const starContainer = document.querySelector(".shooting-stars");

        function createStaticStars(count = 150) {
            for (let i = 0; i < count; i++) {
                const star = document.createElement("span");
                star.classList.add("star-static");

                star.style.top = Math.random() * 100 + "%";
                star.style.left = Math.random() * 100 + "%";

                const size = 2 + Math.random() * 3;
                star.style.width = size + "px";
                star.style.height = size + "px";

                star.style.animationDuration = (2 + Math.random() * 2) + "s";
                star.style.animationDelay = (Math.random() * 3) + "s";

                star.style.setProperty("--parallax", (Math.random() * 0.4 + 0.1));

                starContainer.appendChild(star);
            }
        }

        createStaticStars(150);
    </script>

</body>
</html>
